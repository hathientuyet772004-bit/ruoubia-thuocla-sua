# Shared Admin Center backend environment.
x-common-vars: &common-env
  MONGODB_URI: ${MONGODB_URI}
  MONGODB_DB: ${MONGODB_DB:-auto_collection_data_marketing}
  MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-10000}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
  ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-dev-admin-session-secret}
  ADMIN_SESSION_TTL_SECONDS: ${ADMIN_SESSION_TTL_SECONDS:-28800}
  ADMIN_PRODUCT_LOCAL_FALLBACK_ENABLED: ${ADMIN_PRODUCT_LOCAL_FALLBACK_ENABLED:-false}
  CORS_ALLOW_ORIGINS: ${CORS_ALLOW_ORIGINS:-http://localhost}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
  GEMINI_REJECTED_CANDIDATE_TTL_SECONDS: ${GEMINI_REJECTED_CANDIDATE_TTL_SECONDS:-21600}

services:
  mongodb:
    image: mongo:6.0
    container_name: admin-center-mongodb
    networks:
      - admin-center-network
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: admin-center-backend
    environment:
      <<: *common-env
      BACKEND_HOST: "0.0.0.0"
      BACKEND_PORT: "8080"
    networks:
      - admin-center-network
    volumes:
      - ./store:/app/store
      - ./logs:/app/logs
    restart: unless-stopped
    expose:
      - "${BACKEND_PORT:-8080}"

  worker:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: admin-center-worker
    environment:
      <<: *common-env
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-60}
      WORKER_RUN_INTERVAL_SECONDS: ${WORKER_RUN_INTERVAL_SECONDS:-300}
      WORKER_RUN_MANUAL_PIPELINES: ${WORKER_RUN_MANUAL_PIPELINES:-false}
      WORKER_FETCH_TIMEOUT_SECONDS: ${WORKER_FETCH_TIMEOUT_SECONDS:-30}
      WORKER_MAX_RESPONSE_BYTES: ${WORKER_MAX_RESPONSE_BYTES:-1000000}
      WORKER_PAGE_BUDGET: ${WORKER_PAGE_BUDGET:-10}
      WORKER_MAX_PAGE_BUDGET: ${WORKER_MAX_PAGE_BUDGET:-20}
      WORKER_RECRAWL_MIN_HOURS: ${WORKER_RECRAWL_MIN_HOURS:-24}
      WORKER_RAW_PAGE_RETENTION_DAYS: ${WORKER_RAW_PAGE_RETENTION_DAYS:-14}
      WORKER_MAX_RAW_PAGES_PER_DOMAIN: ${WORKER_MAX_RAW_PAGES_PER_DOMAIN:-100}
    networks:
      - admin-center-network
    volumes:
      - ./store:/app/store
      - ./logs:/app/logs
    depends_on:
      - backend
      - mongodb
    restart: unless-stopped
    healthcheck:
      disable: true
    command: ["python", "-m", "apps.admin_center.backend.worker"]

  frontend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.frontend
    container_name: admin-center-frontend
    networks:
      - admin-center-network
    depends_on:
      - backend
    restart: unless-stopped
    expose:
      - "${FRONTEND_PORT:-3000}"

  nginx:
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    container_name: admin-center-nginx
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
    volumes:
      - ./infra/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - admin-center-network
    restart: unless-stopped

networks:
  admin-center-network:
    driver: bridge

volumes:
  mongodb_data:
