name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile backend modules
        run: |
          python -m py_compile \
            src/apps/admin_center/backend/main.py \
            src/apps/admin_center/backend/dependencies.py \
            src/apps/admin_center/backend/auth.py \
            src/apps/admin_center/backend/mongo_store.py \
            src/apps/admin_center/backend/settings.py \
            src/apps/admin_center/backend/services.py \
            src/apps/admin_center/backend/dashboard_service.py \
            src/apps/admin_center/backend/extraction_service.py \
            src/apps/admin_center/backend/job_service.py \
            src/apps/admin_center/backend/product_service.py \
            src/apps/admin_center/backend/source_service.py \
            src/apps/admin_center/backend/routes/*.py

      - name: Validate example env
        run: python scripts/validate-env.py --env-file .env.example

      - name: Validate production example env
        run: python scripts/validate-env.py --env-file .env.production.example

      - name: Run backend tests
        env:
          PYTHONPATH: src
        run: python -m unittest tests.test_admin_center_api tests.test_admin_center_frontend_routes

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: src/apps/admin_center/frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "18"
          cache: npm
          cache-dependency-path: src/apps/admin_center/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

  docker-smoke:
    name: Docker smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare local env
        run: |
          cp .env.example .env
          printf "\nHOST_HTTP_PORT=8088\n" >> .env

      - name: Build and start compose stack
        run: docker compose up -d --build

      - name: Check nginx frontend and backend health
        run: |
          for i in {1..12}; do
            if curl -fsS http://localhost:8088/ >/dev/null && curl -fsS http://localhost:8088/api/health >/dev/null; then
              docker compose ps
              exit 0
            fi
            sleep 5
          done
          docker compose ps
          docker compose logs
          exit 1

      - name: Stop compose stack
        if: always()
        run: docker compose down --remove-orphans
