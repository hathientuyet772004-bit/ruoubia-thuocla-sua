services:
  # Production overrides / hardening
  backend:
    environment:
      ENV: production
      DEBUG: "false"
      # If you keep frontend & backend behind the same origin (nginx),
      # you can omit CORS entirely by leaving CORS_ALLOW_ORIGINS empty.
      # CORS_ALLOW_ORIGINS: "https://your-domain.com"

  nginx:
    # Ensure we use the pinned image in prod (set NGINX_IMAGE in .env.production)
    image: ${NGINX_IMAGE:-nginx:1.27-alpine}
    ports:
      - "${HOST_HTTP_PORT:-80}:80"
      # Enable only after SSL certificates and the 443 server block are configured in infra/nginx.conf.
      - "${HOST_HTTPS_PORT:-443}:443"
